# dsh-qq bundle patch
#
# 通过 `dsh plugin --profile <name> add dsh-qq-onebot` 安装后，dsh 启动时自动加载本 patch。
#
# 前置：本机需要跑一个 NapCat（或任何 OneBot 11 实现），并开启「正向 WebSocket」服务，
# 默认地址 ws://127.0.0.1:3001。详见 README.md。
#
# 叠加顺序：dsh-base → 本 bundle patch → profile cordis.patch.yml → --patch
# 注意：后层 patch 是「整行替换 config」，不是深合并。要覆盖这里某个键，请把整块 config 重写一遍。

- insert:
    - id: dsh-qq
      name: 'dsh-qq'
      config:
        # ── 连接 ──
        wsUrl: 'ws://127.0.0.1:3001'
        accessToken: ''
        selfId: ''
        reconnectMs: 5000

        # ── Agent ──
        # provider/model/preset/cwd 留空 = 跟随宿主默认
        directPrompt: ''
        groupPrompt: ''
        historyLimit: 20

        # ── 触发 ──
        requireMention: true
        replyToPrivate: true
        groupMode: open
        groupAllow: []
        privateMode: open
        privateAllow: []

        # ── 输出 ──
        textChunkLimit: 1500
        showToolResults: false
        splitDelayMs: 400

        # ── 其他 ──
        sessionIdleTimeout: 1800000
        debug: false
